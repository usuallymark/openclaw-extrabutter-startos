name: Tag and Release

on:
  push:
    branches: ['master']
    paths-ignore: ['*.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP "version:\s*['\"\`]\K[^'\"\`]*" startos/versions/current.ts | head -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION//:/.}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          which tar2sqfs || (echo "tar2sqfs not in squashfs-tools, trying squashfs-tools-ng" && sudo apt-get install -y squashfs-tools-ng)
          which mksquashfs tar2sqfs 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Install start-cli
        run: |
          curl -fsSL "https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2Fv2.2.0/start-cli_x86_64-linux" \
            -o /usr/local/bin/start-cli
          chmod +x /usr/local/bin/start-cli
          start-cli --version

      - name: Initialize packaging workspace
        run: |
          cd ..
          start-cli s9pk init-workspace
          mkdir -p .startos
          echo "host: https://localhost" > .startos/config.yaml

      # start-cli signs packages with the workspace's .startos/build.key.pem,
      # which `s9pk init-workspace` above makes fresh on every run, so every
      # release until :41 had a different, random signer and StartOS could
      # not be told to trust "this package's key". Sign with the one key in
      # the DEV_KEY secret instead (an Ed25519 private key, PKCS#8 PEM), and
      # stop rather than publish a release signed by a throwaway key.
      - name: Sign with the package key
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          [ -n "$DEV_KEY" ] || { echo "::error::The DEV_KEY secret is not set. Releases must be signed with the package key (see UPDATING.md)."; exit 1; }
          umask 077
          # start-cli's PEM reader refuses a blank line after the END line
          # (PEM error, make's "Error 60"), which a secret pasted from the
          # clipboard usually has; openssl does not mind. Drop carriage
          # returns and blank lines (a PEM block has none), then test the
          # file with start-cli itself, the reader that signs.
          printf '%s\n' "$DEV_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > ../.startos/build.key.pem
          openssl pkey -in ../.startos/build.key.pem -noout -text 2>/dev/null | grep -q '^ED25519 Private-Key' \
            || { echo "::error::DEV_KEY is not an Ed25519 private key in PEM form (-----BEGIN PRIVATE KEY-----)."; exit 1; }
          KEYHOME=$(mktemp -d)
          mkdir -p "$KEYHOME/.startos" && cp ../.startos/build.key.pem "$KEYHOME/.startos/id.key.pem"
          HOME="$KEYHOME" start-cli pubkey > signer.pub \
            || { echo "::error::start-cli cannot read DEV_KEY as a signing key."; rm -rf "$KEYHOME"; exit 1; }
          rm -rf "$KEYHOME"
          echo "Signed by:"; cat signer.pub
          { echo 'Signed by this key (StartOS: System → Trusted Keys → Add key, Packages on):'; echo; echo '```'; cat signer.pub; echo '```'; } > release-body.md

      - name: Build s9pk
        run: make

      - name: Check the package's signer
        run: |
          python3 - <<'PY'
          import base64
          want = base64.b64decode(''.join(l for l in open('signer.pub').read().split('\n') if l and not l.startswith('-----')))[-32:]
          for f in __import__('glob').glob('*.s9pk'):
              head = open(f, 'rb').read(35)
              assert head[:3] == b';;\x02' and head[3:35] == want, f'{f} is not signed by the package key'
              print(f'{f}: signed by the package key')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          files: '*.s9pk'
          body_path: release-body.md
          generate_release_notes: false
