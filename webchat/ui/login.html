<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
<link rel="manifest" href="/u/{{PROFILE_ID}}/manifest.webmanifest">
<link rel="apple-touch-icon" href="/u/{{PROFILE_ID}}/icon-180.png">
<link rel="stylesheet" href="/static/app.css">
<title>{{APP_NAME}} — {{PROFILE_NAME}}</title>
</head>
<body style="{{THEME}}">
<div class="center-page">
  <div class="card">
    <img src="/u/{{PROFILE_ID}}/avatar" alt="">
    <h1>{{PROFILE_NAME}}</h1>
    <p>Enter your PIN to continue. This device will be remembered.</p>
    {{MESSAGE}}
    <form method="post" action="/u/{{PROFILE_ID}}/login">
      <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" required autofocus aria-label="PIN">
      <button type="submit">Continue</button>
    </form>
  </div>
</div>
</body>
</html>
