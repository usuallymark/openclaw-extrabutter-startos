<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
<link rel="manifest" href="/u/{{PROFILE_ID}}/manifest.webmanifest">
<link rel="apple-touch-icon" href="/u/{{PROFILE_ID}}/icon-180.png">
<link rel="icon" href="/u/{{PROFILE_ID}}/avatar">
<link rel="stylesheet" href="/static/app.css">
<title>{{APP_NAME}}</title>
</head>
<body data-profile="{{PROFILE_ID}}" data-profile-name="{{PROFILE_NAME}}" data-app-name="{{APP_NAME}}" data-has-pin="{{HAS_PIN}}" style="{{THEME}}">
<div id="app">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Conversations</span>
      <button class="new-chat-btn" id="new-btn" type="button">+ New</button>
    </div>
    <nav id="conv-list" aria-label="Conversations"></nav>
    <div class="sidebar-footer">
      <span>{{PROFILE_NAME}}</span>
      <form method="post" action="/u/{{PROFILE_ID}}/logout" id="logout-form" hidden><button type="submit">Sign out</button></form>
    </div>
  </aside>
  <main id="chat-wrap">
    <div id="chat-inner">
      <header class="header">
        <button class="hamburger" id="menu-btn" type="button" aria-label="Conversations"><span></span><span></span><span></span></button>
        <div class="avatar"><img src="/u/{{PROFILE_ID}}/avatar" alt=""></div>
        <div class="header-center">
          <span class="header-title">{{APP_NAME}}</span>
          <span class="conv-label" id="conv-label">General</span>
        </div>
        <span class="status-dot off" id="status-dot" title="Connecting…"></span>
      </header>
      <div id="banner">Reconnecting to {{APP_NAME}}…</div>
      <div id="messages" aria-live="polite"></div>
      <div class="input-area" id="input-area">
        <textarea id="msg-input" rows="1" placeholder="Message {{APP_NAME}}…" aria-label="Message"></textarea>
        <button class="round-btn" id="send-btn" type="button" aria-label="Send" disabled><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        <button class="round-btn" id="stop-btn" type="button" aria-label="Stop"><span></span></button>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="dialog" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <span class="modal-title" id="dialog-title"></span>
    <input type="text" id="dialog-input" maxlength="80">
    <div class="modal-btns">
      <button class="btn-ghost" id="dialog-cancel" type="button">Cancel</button>
      <button class="btn-primary" id="dialog-ok" type="button">OK</button>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
